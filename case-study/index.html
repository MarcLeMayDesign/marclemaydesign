document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f0eee9;color:#1a1a1a;-webkit-text-size-adjust:100%}\na{color:#8f4632}a:hover{color:#190f1d}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"font:400 17px/1.6 'Public Sans',system-ui,sans-serif;color:#1a1a1a;text-wrap:pretty\">\n<div style=\"max-width:64rem;margin:0 auto;padding:2rem 1.5rem 4rem\">\n\n  <header style=\"display:flex;flex-wrap:wrap;gap:1rem 2rem;justify-content:space-between;align-items:baseline;padding-bottom:.75rem;border-bottom:1px solid #d8d4cd;margin-bottom:2.5rem\">\n    <a href=\"/\" style=\"font:600 14px/1.2 'Karla',sans-serif;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:#190f1d\">Marc LeMay<\u002Fa>\n    <nav style=\"display:flex;flex-wrap:wrap;gap:1.25rem;font:600 13px/1 'Karla',sans-serif;letter-spacing:.12em;text-transform:uppercase\">\n      <a href=\"/\" style=\"text-decoration:none;color:#1a1a1a;font-weight:500\">Work<\u002Fa>\n      <a href=\"/about/\" style=\"text-decoration:none\">About<\u002Fa>\n      <a href=\"/contact/\" style=\"text-decoration:none\">Contact<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <div style=\"font:600 13px/1 'Karla',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#6b665e;margin-bottom:.75rem\">Case study · Conscious Discipline at Home<\u002Fdiv>\n\n  <h1 style=\"font:800 clamp(2.25rem,4.4vw,3.25rem)/1.02 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.035em;margin:0 0 1.5rem;max-width:28ch;text-wrap:balance\">Parents don't need another lesson — they need somewhere safe to try it.<\u002Fh1>\n\n  <div style=\"height:5px;background:#c4705a;max-width:320px;margin:0 0 1.5rem\"><\u002Fdiv>\n\n  <p style=\"font-size:1.25rem;line-height:1.45;color:#4a463f;max-width:44ch;margin:0 0 2.5rem\">A self-paced module I researched, designed, and built: it teaches parents their school's discipline framework, then drops them into a real moment and responds to what they actually say.<\u002Fp>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:0 0 .5rem\">Walk four screens<\u002Fh2>\n  <p style=\"max-width:56ch;margin:0 0 1.25rem;color:#4a463f;font-size:16px\">Not screenshots. The same HTML the module ships, embedded here.<\u002Fp>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:.75rem 1.25rem;align-items:center;justify-content:space-between;margin-bottom:1rem;max-width:960px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:.5rem\">\n    <sc-for list=\"{{ chips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n      <button type=\"button\" sc-camel-on-click=\"{{ chip.go }}\" style=\"border:0;cursor:pointer;font:500 13.5px 'Public Sans',system-ui,sans-serif;padding:.5rem .875rem;border-radius:999px;text-align:left;background:{{ chip.bg }};color:{{ chip.fg }}\">\n        <span>{{ chip.label }}<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fsc-for>\n    <\u002Fdiv>\n    <span style=\"font:600 11.5px/1.4 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e\">Click a screen for full size<\u002Fspan>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isZoomed }}\" hint-placeholder-val=\"{{ false }}\">\n  <button type=\"button\" ref=\"{{ closeRef }}\" sc-camel-on-click=\"{{ closeFull }}\" style=\"position:fixed;top:1rem;right:1rem;z-index:70;cursor:pointer;border:0;border-radius:999px;background:#f0eee9;color:#1a1a1a;padding:.625rem 1rem;font:600 13px/1 'Karla',sans-serif;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 2px 10px rgba(0,0,0,.35)\">Close<\u002Fbutton>\n  <\u002Fsc-if>\n\n  <div ref=\"{{ outerRef }}\" sc-camel-on-click=\"{{ toggleFull }}\" sc-camel-on-key-down=\"{{ onFrameKey }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"Open this screen at full size\" style=\"overflow:hidden;border-radius:6px;background:#EDEAE3;cursor:zoom-in;max-width:960px\">\n    <div ref=\"{{ innerRef }}\" style=\"width:960px;transform-origin:top left\">\n\n      <sc-if value=\"{{ isBaseline }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"width:960px;height:640px;box-sizing:border-box;display:flex;flex-direction:column;background:#1C2030;border-radius:6px;overflow:hidden;font-family:'Work Sans',Helvetica,Arial,sans-serif\">\n        <div style=\"height:60px;flex:none;box-sizing:border-box;padding:0 34px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333A50\">\n          <div style=\"font:600 15px 'Work Sans',sans-serif;color:#F4F1EA\">Conscious Discipline at Home<\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"width:26px;height:26px;flex:none;border-radius:10px;background:#272C3E;display:flex;align-items:center;justify-content:center;font:500 13px 'Work Sans',sans-serif;color:#C3C9D8\">?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:38px 34px 0\">\n          <div style=\"width:100%;max-width:620px;display:flex;flex-direction:column\">\n            <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#D79AB3\">Before we start<\u002Fdiv>\n            <div style=\"font:575 30px/1.16 'Work Sans',sans-serif;color:#F4F1EA;letter-spacing:-.012em;margin-top:6px\">One morning, before we begin<\u002Fdiv>\n            <div style=\"font:400 15.5px/1.6 'Work Sans',sans-serif;color:#C3C9D8;margin-top:16px\">It's 7:40 in the morning and the bus comes in ten minutes. Your child is sitting in the hallway with one shoe on and the other kicked across the rug.<\u002Fdiv>\n            <div style=\"font:400 17px/1.5 'Work Sans',sans-serif;color:#F4F1EA;margin-top:14px;padding:13px 17px;background:#3A2A35;border-radius:14px\">\"I'm NOT wearing these stupid shoes! They feel weird and I HATE them!\"<\u002Fdiv>\n            <div style=\"font:500 16px/1.5 'Work Sans',sans-serif;color:#F4F1EA;margin-top:22px\">What would you say?<\u002Fdiv>\n            <div style=\"margin-top:10px;min-height:96px;border-radius:14px;background:#272C3E;box-shadow:0 0 0 1px #3D4459;padding:14px 16px;font:400 15.5px/1.5 'Work Sans',sans-serif;color:#9BA3B8\">Type what you'd actually say…<\u002Fdiv>\n            <div style=\"font:400 13.5px/1.5 'Work Sans',sans-serif;color:#ADB4C6;margin-top:10px\">Nothing here is scored and nobody else sees it. We'll come back to what you wrote at the end.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:0 34px 26px;display:flex;justify-content:center\">\n          <div style=\"width:100%;max-width:620px;display:flex;align-items:center;gap:20px\">\n            <div style=\"flex:none;padding:14px 30px;border-radius:14px;background:#2E86C8;color:#0F1420;font:600 14.5px 'Work Sans',sans-serif\">Continue<\u002Fdiv>\n            <div style=\"font:500 14px 'Work Sans',sans-serif;color:#8FC0E6\">I'd rather start with the module<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isRolePlay }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:960px;height:640px;box-sizing:border-box;display:flex;flex-direction:column;background:#FBF9F4;border-radius:6px;overflow:hidden;font-family:'Work Sans',Helvetica,Arial,sans-serif\">\n        <div style=\"height:60px;flex:none;box-sizing:border-box;padding:0 34px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #E2DCCE\">\n          <div style=\"font:600 15px 'Work Sans',sans-serif;color:#25293C\">Try It Out<\u002Fdiv>\n          <div style=\"font:400 15px 'Work Sans',sans-serif;color:#A39C8A\">·<\u002Fdiv>\n          <div style=\"font:400 15px 'Work Sans',sans-serif;color:#5F6272\">practicing in a real moment<\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"font:500 12px 'Work Sans',sans-serif;color:#5F6272\">Scenario 1 of 3<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\">\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#1F6FAD\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#DAD4C6\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#DAD4C6\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:26px;height:26px;flex:none;border-radius:10px;background:#FFFCF5;box-shadow:0 1px 2px rgba(60,52,32,.10),0 0 0 .5px rgba(60,52,32,.06);display:flex;align-items:center;justify-content:center;font:500 13px 'Work Sans',sans-serif;color:#5F6272\">?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;padding:24px 34px 0\">\n          <div style=\"width:100%;max-width:620px;display:flex;flex-direction:column;min-height:0\">\n            <div style=\"font:400 14px/1.55 'Work Sans',sans-serif;color:#5F6272;padding-bottom:16px;border-bottom:1px solid #E2DCCE\">5:30 PM, dinner is ready, and the timer you set five minutes ago has just gone off. Maya, 5, is on the couch with the tablet.<\u002Fdiv>\n            <div style=\"flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:16px;padding:18px 0 4px\">\n              <div style=\"align-self:flex-start;max-width:82%;background:#F3E7EC;border-radius:14px;padding:13px 17px\">\n                <div style=\"font:500 10px 'Work Sans',sans-serif;letter-spacing:.11em;color:#8E3A57\">MAYA<\u002Fdiv>\n                <div style=\"font:400 16.5px/1.5 'Work Sans',sans-serif;color:#25293C;margin-top:4px\">Five more minutes. FIVE MORE MINUTES. I'm almost done!<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font:500 10px 'Work Sans',sans-serif;letter-spacing:.11em;color:#1F6FAD\">YOU<\u002Fdiv>\n                <div style=\"font:400 16.5px/1.5 'Work Sans',sans-serif;color:#25293C;margin-top:4px\">I know it's really hard to stop in the middle of something good.<\u002Fdiv>\n                <div style=\"font:400 13.5px/1.5 'Work Sans',sans-serif;color:#5F6272;margin-top:7px;padding-left:13px;box-shadow:inset 2px 0 0 #9FC3DF\">You named what she was feeling before you named the rule — that's connection before correction. She hasn't moved yet, though, and the limit still needs saying.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"align-self:flex-start;max-width:82%;background:#F3E7EC;border-radius:14px;padding:13px 17px\">\n                <div style=\"font:500 10px 'Work Sans',sans-serif;letter-spacing:.11em;color:#8E3A57\">MAYA<\u002Fdiv>\n                <div style=\"font:400 16.5px/1.5 'Work Sans',sans-serif;color:#25293C;margin-top:4px\">So then I can finish it. You said it's hard, so let me finish it.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:10px 34px 22px;display:flex;justify-content:center\">\n          <div style=\"width:100%;max-width:620px;display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex\">\n              <div style=\"display:inline-flex;align-items:center;gap:8px;background:#FFFCF5;border-radius:999px;padding:7px 15px;box-shadow:0 1px 2px rgba(60,52,32,.10),0 0 0 .5px rgba(60,52,32,.06)\">\n                <span style=\"font:500 13px 'Work Sans',sans-serif;color:#25293C\">Words to try<\u002Fspan>\n                <span style=\"font:400 13px 'Work Sans',sans-serif;color:#A39C8A\">·<\u002Fspan>\n                <span style=\"font:500 13px 'Work Sans',sans-serif;color:#5F6272\">3<\u002Fspan>\n                <span style=\"font:400 13px 'Work Sans',sans-serif;color:#5F6272\">⌄<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:stretch\">\n              <div style=\"flex:1;min-height:70px;border-radius:14px;background:#FFFCF5;box-shadow:0 1px 2px rgba(60,52,32,.10),0 0 0 1px #DAD4C6;padding:13px 16px;font:400 15.5px/1.5 'Work Sans',sans-serif;color:#5F6272\">Type what you'd say next…<\u002Fdiv>\n              <div style=\"flex:none;align-self:flex-end;padding:14px 26px;border-radius:14px;background:#1F6FAD;color:#fff;font:600 14.5px 'Work Sans',sans-serif\">Say it<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:400 13px/1.5 'Work Sans',sans-serif;color:#5F6272\">There's no single right answer. Say it the way you'd actually say it.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCoach }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:960px;height:640px;box-sizing:border-box;display:flex;flex-direction:column;background:#FBF9F4;border-radius:6px;overflow:hidden;font-family:'Work Sans',Helvetica,Arial,sans-serif\">\n        <div style=\"height:60px;flex:none;box-sizing:border-box;padding:0 34px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #E2DCCE\">\n          <div style=\"font:600 15px 'Work Sans',sans-serif;color:#25293C\">Test Your Knowledge<\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"font:500 12px 'Work Sans',sans-serif;color:#5F6272\">Question 1 of 4<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\">\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#1F6FAD\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#DAD4C6\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#DAD4C6\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#DAD4C6\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:26px;height:26px;flex:none;border-radius:10px;background:#FFFCF5;box-shadow:0 1px 2px rgba(60,52,32,.10),0 0 0 .5px rgba(60,52,32,.06);display:flex;align-items:center;justify-content:center;font:500 13px 'Work Sans',sans-serif;color:#5F6272\">?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;padding:22px 34px 0;display:flex;flex-direction:column;align-items:center\">\n          <div style=\"width:100%;max-width:660px;display:flex;flex-direction:column;gap:13px;min-height:0\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap\">\n              <div style=\"font:575 26px/1.2 'Work Sans',sans-serif;color:#25293C;letter-spacing:-.01em\">You started with yourself<\u002Fdiv>\n              <div style=\"font:500 12px 'Work Sans',sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#63604F;background:#F0ECE1;border-radius:999px;padding:5px 13px\">Nearly there<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5F6272\">What you wrote<\u002Fdiv>\n              <div style=\"font:400 15.5px/1.55 'Work Sans',sans-serif;color:#25293C;margin-top:7px;padding:14px 16px;background:#FFFCF5;border-radius:14px;box-shadow:0 1px 2px rgba(60,52,32,.10)\">He's been holding it together all afternoon and he's run out. Honestly the thing I'd have to deal with first is me — I was about to say that because of the woman behind us.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\">\n              <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:13px;align-items:baseline;padding:9px 0;border-bottom:1px solid #E9E3D6\">\n                <div style=\"font:500 14px 'Work Sans',sans-serif;color:#1F6FAD\">✓<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 'Work Sans',sans-serif;color:#25293C\">You read the outburst as running out of capacity, not as a choice<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:13px;align-items:baseline;padding:9px 0;border-bottom:1px solid #E9E3D6\">\n                <div style=\"font:500 14px 'Work Sans',sans-serif;color:#1F6FAD\">✓<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 'Work Sans',sans-serif;color:#25293C\">You named your own state as the first thing to manage<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr);gap:13px;align-items:baseline;padding:9px 0\">\n                <div style=\"font:500 14px 'Work Sans',sans-serif;color:#8E3A57\">—<\u002Fdiv>\n                <div style=\"font:400 15px/1.5 'Work Sans',sans-serif;color:#8E3A57\">You didn't say that a consequence wouldn't land while he's shouting<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#E7EFF7;border-radius:14px;padding:15px 18px\">\n              <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#1F6FAD\">One way to say it<\u002Fdiv>\n              <div style=\"font:400 15px/1.55 'Work Sans',sans-serif;color:#3B3E4C;margin-top:6px\">The chocolate bar is the trigger, not the reason — he's run out of capacity, and a consequence won't land while he's shouting. The first thing to handle is my own state: I'm reacting to being watched, not to him.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:28px 34px 26px;display:flex;justify-content:center\">\n          <div style=\"width:100%;max-width:660px;display:flex;align-items:center;gap:20px;flex-wrap:wrap\">\n            <div style=\"flex:none;padding:14px 28px;border-radius:14px;background:#1F6FAD;color:#fff;font:600 14.5px 'Work Sans',sans-serif\">Next question<\u002Fdiv>\n            <div style=\"font:500 14px 'Work Sans',sans-serif;color:#1F6FAD\">I think my answer covered this<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isBookend }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"width:960px;height:640px;box-sizing:border-box;display:flex;flex-direction:column;background:#1C2030;border-radius:6px;overflow:hidden;font-family:'Work Sans',Helvetica,Arial,sans-serif\">\n        <div style=\"height:60px;flex:none;box-sizing:border-box;padding:0 34px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333A50\">\n          <div style=\"font:600 15px 'Work Sans',sans-serif;color:#F4F1EA\">Try It Out<\u002Fdiv>\n          <div style=\"font:400 15px 'Work Sans',sans-serif;color:#7C8499\">·<\u002Fdiv>\n          <div style=\"font:400 15px 'Work Sans',sans-serif;color:#ADB4C6\">the same morning, twice<\u002Fdiv>\n          <div style=\"flex:1\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:6px\">\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#2E86C8\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#2E86C8\"><\u002Fdiv>\n            <div style=\"width:20px;height:5px;border-radius:3px;background:#2E86C8\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"width:26px;height:26px;flex:none;border-radius:10px;background:#272C3E;display:flex;align-items:center;justify-content:center;font:500 13px 'Work Sans',sans-serif;color:#C3C9D8\">?<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;padding:30px 34px 0;display:flex;flex-direction:column;gap:20px\">\n          <div>\n            <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8FC0E6\">7:40 in the morning<\u002Fdiv>\n            <div style=\"font:575 29px/1.16 'Work Sans',sans-serif;color:#F4F1EA;letter-spacing:-.012em;margin-top:6px\">Where you started, where you are<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px;min-height:0\">\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#D79AB3\">Before the module<\u002Fdiv>\n              <div style=\"flex:1;background:#3A2A35;border-radius:14px;padding:16px 18px;font:400 15.5px/1.55 'Work Sans',sans-serif;color:#EFE6EA\">\"I'd probably tell him we don't have time for this and just put them on him myself. Then feel awful about it in the car.\"<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <div style=\"font:500 11px 'Work Sans',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#8FC0E6\">Just now<\u002Fdiv>\n              <div style=\"flex:1;background:#23344A;border-radius:14px;padding:16px 18px;font:400 15.5px/1.55 'Work Sans',sans-serif;color:#E4EDF5\">\"I can see those shoes feel wrong right now. I'm going to take a breath. Shoes keep your feet safe at school — do you want the left one first, or should I help with the heel?\"<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font:500 15.5px/1.5 'Work Sans',sans-serif;color:#F4F1EA\">Looking at those two side by side — what changed in how you handled your own composure?<\u002Fdiv>\n            <div style=\"margin-top:10px;min-height:74px;border-radius:14px;background:#272C3E;box-shadow:0 0 0 1px #3D4459;padding:13px 16px;font:400 15.5px/1.5 'Work Sans',sans-serif;color:#9BA3B8\">Whatever comes to mind…<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:none;padding:16px 34px 24px;display:flex;align-items:center;gap:20px\">\n          <div style=\"flex:none;padding:14px 30px;border-radius:14px;background:#2E86C8;color:#0F1420;font:600 14.5px 'Work Sans',sans-serif\">Finish the module<\u002Fdiv>\n          <div style=\"font:400 13.5px 'Work Sans',sans-serif;color:#ADB4C6\">This is yours to keep — it appears again on the next screen.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:1rem 1.5rem;align-items:center;margin-top:1rem;max-width:960px\">\n    <div style=\"display:flex;gap:.5rem\">\n      <button type=\"button\" sc-camel-on-click=\"{{ prev }}\" style=\"cursor:pointer;border:1px solid #d8d4cd;background:#f6f4f0;color:#1a1a1a;border-radius:.375rem;padding:.5rem .875rem;font:500 14px 'Public Sans',system-ui,sans-serif\" style-hover=\"background:#f4e9e4;border-color:#c4705a\">← Back<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"cursor:pointer;border:1px solid #d8d4cd;background:#f6f4f0;color:#1a1a1a;border-radius:.375rem;padding:.5rem .875rem;font:500 14px 'Public Sans',system-ui,sans-serif\" style-hover=\"background:#f4e9e4;border-color:#c4705a\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;color:#6b665e;max-width:52ch;flex:1;min-width:16rem\">{{ stepCaption }}<\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr));gap:1.5rem 2rem;padding:1.5rem 0;border-top:1px solid #d8d4cd;border-bottom:1px solid #d8d4cd;margin:1.75rem 0 0\">\n    <div>\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e;margin-bottom:.5rem\">My role<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.5;color:#4a463f\">Research, architecture, scenario writing, assessment design, UX, visual design, and the build. No client, no brief — I'm the parent this was written for.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e;margin-bottom:.5rem\">Scope<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.5;color:#4a463f\">3 sections · 35–40 minutes, resumable at any point.<\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e;margin-bottom:.5rem\">Built with<\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.5;color:#4a463f\">HTML, CSS, JavaScript — the screens below are the real thing. Rise 360 for the reference section, Rive for concept animation.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">The problem<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">My child's school trains its staff in a discipline framework, and sent the parents a one-page PDF. The parents I know read it and agreed with it. But the first time we need any of it, it's 7:40 in the morning, there's a shoe across the hallway, and the bus is coming.<\u002Fp>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">So the module is built around one bet: trying the words is not the same as reading them. A parent who has typed their own sentence and had it answered starts from a different place than a parent who has only read the handout.<\u002Fp>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">How it's built<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:1.25rem;max-width:56rem;margin:0 0 1rem;margin-left:-5px\">\n    <div style=\"background:#f6f4f0;border:1px solid #d8d4cd;border-radius:.5rem;padding:1.125rem\">\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e\">Section 1<\u002Fdiv>\n      <div style=\"font:700 17px/1.3 'Public Sans',system-ui,sans-serif;margin:.375rem 0 .375rem\">Learn<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.5;color:#4a463f\">Four principles, each opened by the old frame it replaces.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f6f4f0;border:1px solid #d8d4cd;border-radius:.5rem;padding:1.125rem\">\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e\">Section 2<\u002Fdiv>\n      <div style=\"font:700 17px/1.3 'Public Sans',system-ui,sans-serif;margin:.375rem 0 .375rem\">Test your knowledge<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.5;color:#4a463f\">Four written scenarios, each needing more than one principle.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#f6f4f0;border:1px solid #d8d4cd;border-radius:.5rem;padding:1.125rem\">\n      <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e\">Section 3<\u002Fdiv>\n      <div style=\"font:700 17px/1.3 'Public Sans',system-ui,sans-serif;margin:.375rem 0 .375rem\">Try it out<\u002Fdiv>\n      <div style=\"font-size:14.5px;line-height:1.5;color:#4a463f\">Three multi-turn role-plays that escalate: two turns, three, then four.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">Before any screen got styled, a wireframe audit triaged 41 items into settled, blocking, and open; seven blockers closed.<\u002Fp>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">An unscored baseline sits before section 1 and its reflection after section 3, so the comparison is self-referenced: the parent measures against their own first answer, not a model answer and not a number. Attempting the moment before being taught it is also what makes the teaching land.<\u002Fp>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">Seven decisions, and what I rejected<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1.75rem;color:#4a463f\">Every one of these had a defensible alternative.<\u002Fp>\n\n  <div style=\"display:flex;flex-direction:column;gap:2rem;max-width:56rem\">\n    <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"6\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:1.25rem 2rem;padding-top:1.25rem;border-top:1px solid #d8d4cd\">\n        <div>\n          <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e;margin-bottom:.5rem\">{{ d.tag }}<\u002Fdiv>\n          <div style=\"font:700 19px/1.25 'Public Sans',system-ui,sans-serif;letter-spacing:-.01em;margin-bottom:.5rem\">{{ d.title }}<\u002Fdiv>\n          <div style=\"font-size:16px;line-height:1.55;color:#1a1a1a\">{{ d.did }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#f4e9e4;border-radius:.5rem;padding:1rem 1.125rem\">\n          <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#8f4632;margin-bottom:.5rem\">Instead of<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:#1a1a1a;font-weight:500;margin-bottom:.5rem\">{{ d.rejected }}<\u002Fdiv>\n          <div style=\"font-size:15px;line-height:1.55;color:#4a463f\">{{ d.why }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <p style=\"max-width:34rem;margin:2.5rem 0 0;color:#4a463f\">The decisions above about tone and stakes are the oldest part of this practice. Asking someone to try a thing they expect to be bad at, and keeping them willing to try it again, is what I was doing in a classroom long before I built any of this.<\u002Fp>\n  <figure style=\"max-width:44rem;margin:1.75rem 0 0;padding:.25rem 0 .25rem 1.5rem;border-left:2px solid #d8d4cd\">\n    <blockquote style=\"margin:0;font:400 20px/1.5 'Public Sans',Helvetica,Arial,sans-serif;color:#1a1a1a;text-wrap:pretty\">“I’ve come to understand that learning is never just about mastering what’s written in books. What meant even more to me was the sense of warmth I felt in Dr. LeMay’s class — it truly made FSU feel like a home away from home.”<\u002Fblockquote>\n    <figcaption style=\"margin:.875rem 0 0;font:600 12px/1.4 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e\">Student evaluation, Florida State University, Fall 2025<\u002Ffigcaption>\n  <\u002Ffigure>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">Inviting honesty means being ready for it<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">The module asks parents to type what they would really say in a hard moment. Most of the time that produces an answer, and the matcher scores it. Sometimes it produces a disclosure — about their child, their home, or themselves — and a rules-based matcher has no business grading that.<\u002Fp>\n  <p style=\"max-width:34rem;margin:0 0 1.5rem;color:#4a463f\">So five pre-written responses sit in front of the scoring. Every free-text field in the module runs the same order: <strong style=\"color: rgb(26, 26, 26);\">safety check first, then the matcher, then the band, then feedback<\u002Fstrong>. If the safety check fires, all the rest is skipped, nothing is scored or recorded, and the parent is given an option to return and try again.<\u002Fp>\n\n  <div style=\"background:#f6f4f0;border:1px solid #d8d4cd;border-radius:.5rem;padding:1.25rem 1.375rem;max-width:44rem;margin:0 0 1.25rem -5px\">\n    <div style=\"font:600 12px/1 'Karla',sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#6b665e;margin-bottom:.875rem\">The five<\u002Fdiv>\n    <ul style=\"margin:0;padding-left:1.25rem;color:#4a463f;font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:.5rem\">\n      <li>A parent frightened of their own anger, or of what they have already done<\u002Fli>\n      <li>A child being hurt, or hurting someone — the one case with a destination inside the module<\u002Fli>\n      <li>A child whose safety is past what a practice module should touch<\u002Fli>\n      <li>A parent in crisis themselves<\u002Fli>\n      <li>A parent asking for real advice about their real child (the most likely of the five)<\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">Each one acknowledges without assessing, names a single concrete next step rather than a menu, teaches nothing, and hands control back with the parent's answer still in the field. There is no judgment, no flashing red banner. Responses appear in the coach's ordinary slot.&nbsp;<\u002Fp>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">The interesting failure is not the one you would guess. Missing a disclosure is bad; <em>firing wrongly<\u002Fem> is worse, because the practice content is itself about a child melting down — \"she hit me\" is an expected sentence in the sibling scenario. The detection lists inside role-plays are deliberately narrower than elsewhere, and the phrase most likely to over-fire is the one an exhausted parent uses at the end of a long evening. Being careful there means accepting some misses in exchange for never telling a tired parent the module thinks they are a risk.<\u002Fp>\n  <p style=\"max-width:34rem;margin:0 0 2rem;color:#4a463f\">The fifth response is the one I would point at. A parent asking \"what should I do about my son's biting\" is not answering the question, and both available failures are real: an answer is impossible, and scoring them as wrong is insulting. Saying plainly that it cannot answer, and naming who can, is the same boundary the disclaimer draws.<\u002Fp>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">What this transfers to<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">Parenting is the subject matter, not the design problem. The design problem was scoring what someone wrote, in a domain where being told you got it wrong stings.<\u002Fp>\n  <ul style=\"max-width:34rem;margin:0 0 1rem;padding-left:1.25rem;color:#4a463f;display:flex;flex-direction:column;gap:.625rem\">\n    <li><strong style=\"color:#1a1a1a\">Free-text scenario design.<\u002Fstrong> Writing prompts that can't be answered by pattern-matching the last screen, with matcher criteria and per-branch feedback for each.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Branching feedback that names criteria, not scores.<\u002Fstrong> Including the case where one criterion cancels the other three.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Knowing when an assessment should refuse to assess.<\u002Fstrong> Any open response field in a sensitive domain — healthcare, HR, safeguarding, compliance — will eventually collect a disclosure. Designing the interception before the scoring is a habit, not a feature.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Behavior change over recall.<\u002Fstrong> A baseline captured before instruction and shown back after.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Help design under load.<\u002Fstrong> Separating reference a learner reads once from support they need mid-task, in one tap.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Low-stakes assessment in a high-stakes emotional context.<\u002Fstrong> Same problem as compliance, feedback, and difficult-conversation training.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">How it gets tested<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">No learner has used this yet. The module goes live in mid-October, and what follows is the plan — written before the results exist, so it can't be written to fit them.<\u002Fp>\n  <div style=\"display:flex;flex-direction:column;gap:.875rem;max-width:44rem;margin-bottom:1rem\">\n    <div style=\"display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem;padding-bottom:.875rem;border-bottom:1px solid #d8d4cd\">\n      <div style=\"font:600 13px/1.4 'Karla',sans-serif;color:#6b665e\">Oct 14–24<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.55;color:#4a463f\"><strong style=\"color:#1a1a1a\">Eight parents, unmoderated, think-aloud on three.<\u002Fstrong> The question is completion, not satisfaction: does anyone finish all three role-plays in one sitting when told it's three?<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem;padding-bottom:.875rem;border-bottom:1px solid #d8d4cd\">\n      <div style=\"font:600 13px/1.4 'Karla',sans-serif;color:#6b665e\">Ongoing<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.55;color:#4a463f\"><strong style=\"color:#1a1a1a\">Read the free-text answers against the matcher.<\u002Fstrong> Every answer the matcher called wrong that a human would call right is a content bug. The \"I think my answer covered this\" link exists to collect them.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem;padding-bottom:.875rem;border-bottom:1px solid #d8d4cd\">\n      <div style=\"font:600 13px/1.4 'Karla',sans-serif;color:#6b665e\">+30 days<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.55;color:#4a463f\"><strong style=\"color:#1a1a1a\">One question, by email: did you use any of it?<\u002Fstrong> This is the only row that tests the module's actual bet, and it's the weakest instrument on the page: self-report, thirty days out. Short of putting a researcher in someone's hallway, it's what I have. With a second cohort I'd replace it with an unannounced fourth role-play.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:5.5rem minmax(0,1fr);gap:1rem\">\n      <div style=\"font:600 13px/1.4 'Karla',sans-serif;color:#6b665e\">Before that<\u002Fdiv>\n      <div style=\"font-size:15.5px;line-height:1.55;color:#4a463f\"><strong style=\"color:#1a1a1a\">Subject-matter review.<\u002Fstrong> A practitioner reads the four principles for substance before any parent sees them. Plain-language paraphrase is a copyright position, not a guarantee of accuracy.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">What I left for a second version<\u002Fh2>\n  <p style=\"max-width:34rem;margin:0 0 1rem;color:#4a463f\">Named here rather than quietly omitted, because the reason for not building them is part of the design.<\u002Fp>\n  <ul style=\"max-width:34rem;margin:0 0 1rem;padding-left:1.25rem;color:#4a463f;display:flex;flex-direction:column;gap:.625rem\">\n    <li><strong style=\"color:#1a1a1a\">Tone of voice, heard rather than described.<\u002Fstrong> The module teaches what to say, and the same sentence lands differently said warmly or said through gritted teeth — text cannot carry that. The version I'd build is small and pull-only: three phrase cards at the close of the practice section gain a listen control, one of them offering the same words two ways with the warm read second. It sits after the practice, never during it, so a parent composing their own reply isn't invited to copy a delivery.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Interface sound, deliberately not.<\u002Fstrong> Click feedback was considered and dropped: most parents open this on a phone with the ringer off, so it never fires, and it duplicates what the visual state already says. Haptics do that job on the devices this actually runs on. Audio earns its place only where the sound is the content.<\u002Fli>\n    <li><strong style=\"color:#1a1a1a\">Assessing how the parent actually sounds.<\u002Fstrong> The honest limit of the practice section: it scores what was typed, not how it would have been said. Recording a spoken reply and giving feedback on delivery is a different product with a different consent conversation, and it belongs in a version that has evidence the written practice works first.<\u002Fli>\n  <\u002Ful>\n\n  <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:2.5rem 0 .5rem\">The working documents<\u002Fh2>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:.75rem 1.5rem;max-width:56rem;margin:1.25rem 0 1rem\">\n    <div style=\"padding-bottom:.75rem;border-bottom:1px solid #d8d4cd\"><a href=\"/case-study/decision-record/\" style=\"font-weight:500\">Design Decision Record<\u002Fa><div style=\"font-size:14px;color:#6b665e;margin-top:.25rem\">The alternatives, the reasoning, and the two I lost.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding-bottom:.75rem;border-bottom:1px solid #d8d4cd\"><a href=\"/case-study/functional-spec/\" style=\"font-weight:500\">Functional spec — scored components<\u002Fa><div style=\"font-size:14px;color:#6b665e;margin-top:.25rem\">Matcher criteria, feedback branches, failure behavior.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding-bottom:.75rem;border-bottom:1px solid #d8d4cd\"><a href=\"/case-study/flow-board/\" style=\"font-weight:500\">Flow board — 26 screens<\u002Fa><div style=\"font-size:14px;color:#6b665e;margin-top:.25rem\">Every screen in parent-journey order, gaps marked as gaps.<\u002Fdiv><\u002Fdiv>\n    <div style=\"padding-bottom:.75rem;border-bottom:1px solid #d8d4cd\"><a href=\"/case-study/visual-design/\" style=\"font-weight:500\">Visual design board<\u002Fa><div style=\"font-size:14px;color:#6b665e;margin-top:.25rem\">Type scale, the three-color system, the light/dark rule.<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:4rem;padding-top:1.75rem;border-top:5px solid #c4705a;max-width:44rem\">\n    <h2 style=\"font:800 1.5rem/1.15 'Public Sans',Helvetica,Arial,sans-serif;letter-spacing:-.022em;margin:0 0 .75rem\">What I'm looking for<\u002Fh2>\n    <p style=\"max-width:34rem;margin:0 0 1.5rem;color:#4a463f\">A team where a design that isn't landing gets fixed in weeks. If you're hiring for instructional or learning experience design, I'd like to hear about it — and I'm glad to walk through any decision on this page in more detail.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:1rem 2rem;align-items:center\">\n      <a href=\"mailto:marclemaydesign@gmail.com\" style=\"font-size:1.0625rem;font-weight:600;text-decoration:none;border-bottom:2px solid #c4705a;padding-bottom:2px\">marclemaydesign@gmail.com<\u002Fa>\n      <a href=\"/resume.pdf\" style=\"font:600 14px/1 'Karla',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8f4632\">Resume (PDF)<\u002Fa>\n      <a href=\"https://www.linkedin.com/in/marclemaydesign\" target=\"_blank\" rel=\"noopener\" style=\"font:600 14px/1 'Karla',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#8f4632\" aria-label=\"LinkedIn profile\" title=\"LinkedIn\"><svg sc-camel-view-box=\"0 0 24 24\" width=\"20\" height=\"20\" fill=\"currentColor\" aria-hidden=\"true\" focusable=\"false\" style=\"display:block\"><path d=\"M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z\"><\u002Fpath><\u002Fsvg><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <footer style=\"margin-top:3rem;padding-top:.75rem;border-top:1px solid #d8d4cd;font-size:14px;color:#6b665e;display:flex;flex-direction:column;gap:1.25rem\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;justify-content:space-between\">\n      <span>Marc LeMay — instructional design<\u002Fspan>\n      <span style=\"display:flex;flex-wrap:wrap;gap:.5rem 1.25rem\"><a href=\"/\" style=\"text-decoration:none\">Work<\u002Fa><a href=\"/about/\" style=\"text-decoration:none\">About<\u002Fa><\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"max-width:68ch;font-size:12.5px;line-height:1.55;color:#8a857c;margin:0\">An independent learning project. Not affiliated with, endorsed by, or reviewed by Conscious Discipline or Loving Guidance. The framework taught here is described in plain language from widely published general ideas; no proprietary phrasing, scripts, or program terminology is reproduced.<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nclass Component extends DCLogic {\n  state = { step: 0, zoom: false };\n  outer = React.createRef();\n  inner = React.createRef();\n\n  steps = [\n    { code: 'SCR-100', label: 'Baseline',\n      caption: 'Unscored, skippable, and deliberately before any teaching. Whatever the parent writes here is the only thing their final answer gets compared to.' },\n    { code: 'SCN-301', label: 'Role-play, turn 2',\n      caption: 'Mid-scenario. The child answers what the parent actually wrote, the coach note sits inline under their line, and the phrase help stays collapsed until asked for.' },\n    { code: 'QZ-201-R', label: 'Coach response',\n      caption: 'A written answer scored against named criteria. Their own words are quoted back first; the model answer appears only after they have committed to theirs.' },\n    { code: 'SCR-304', label: 'Bookend reflection',\n      caption: 'The first answer and the last, side by side, with no verdict attached. The ground is dark for the same reason it was on the baseline screen: the module is talking about the parent, not teaching them.' }\n  ];\n\n  decisions = [\n    { tag: 'Assessment', title: 'No item maps to a single principle',\n      did: 'The knowledge check is four written scenarios \\u2014 supermarket, forced apology, the thing you said, the skeptical grandparent \\u2014 each needing more than one principle at once.',\n      rejected: 'One item per principle',\n      why: 'Mapping one item to one principle teaches the module\\u2019s own shape instead of the material: parents learn that the fourth principle was about limits, and answer from the table of contents rather than from the situation in front of them. Real moments never arrive labeled with which principle applies.' },\n    { tag: 'Assessment', title: 'No percentages anywhere',\n      did: 'Every result is a band \\u2014 Strong, Nearly there, Not yet \\u2014 with the criteria named in plain sentences. There is no overall score at module end.',\n      rejected: 'Per-scenario percentages with no total',\n      why: 'The incoherent middle: precise enough to invite arithmetic, incomplete enough that the arithmetic is meaningless. And a parent who scores 62% on staying calm with their own child has been handed a number about their parenting. The bands survived because they can be said out loud without that.' },\n    { tag: 'Assessment', title: 'The composure cap is never explained as a rule',\n      did: 'If the parent loses their composure, the band is Not yet and the other three criteria go gray rather than ticked, under one line: they only work from a calm voice.',\n      rejected: 'Showing three ticks and a failing result',\n      why: 'Accurate, and it feels unfair \\u2014 I did three of the four things and you failed me. Naming the rule up front (\"composure gates everything\") would have been worse: parents would then read every calm reply as gaming the gate.' },\n    { tag: 'Help', title: 'Hot help inline, cold help in one panel',\n      did: 'Phrase suggestions live in a collapsed strip directly above the answer field. Everything read once \\u2014 glossary, save state, privacy \\u2014 lives in a single panel behind a ? key.',\n      rejected: 'One unified Help drawer; or a permanent reference rail',\n      why: 'Merging them puts a calm reference panel in a hot path every time the parent needs three words fast. The permanent rail had the best case on paper \\u2014 always visible, nothing to learn \\u2014 but it costs 268px, and at 375px that leaves no room for the answer it exists to support. A third option \\u2014 dragging phrase cards into the field \\u2014 died on the detail: it fights touch scroll and the raised keyboard, is unusable by keyboard and screen reader, and needs a tap fallback anyway, so you ship two interactions.' },\n    { tag: 'Help', title: 'The strip never opens itself',\n      did: 'Collapsed by default. When the coach sees a miss it offers the phrases in words \\u2014 \"there are three phrasings under Words to try, if you want them\" \\u2014 and remembers the parent\\u2019s choice after they open it once.',\n      rejected: 'Auto-expanding on a wrong answer',\n      why: 'A panel that springs open the moment you get something wrong is a correction, and it arrives exactly when a struggling parent is least able to hear one. Said as an offer, the help is still right there, and the parent decides whether to take it.' },\n    { tag: 'Visual', title: 'The animated scenes became four still poses',\n      did: 'My own brief called for 3D animated scenes in the roleplay assessments. Built as written, every scenario would open with a scene the parent had to sit through before they could type. It became four still poses of the child \\u2014 overwhelmed, upset, ready to think, contented \\u2014 registered to a common head anchor and crossfaded when the parent\\u2019s own words change the child\\u2019s state.',\n      rejected: 'Animated scenes at the top of each scenario',\n      why: 'This module is opened between dinner and bedtime, and a scene you watch before you can practice is time spent not practicing \\u2014 ambient motion teaches people to hunt for the skip control, and once they are hunting they are not learning. Motion stayed only where the change over time is the content: the brain states dropping and climbing a level, the iceberg opening. Both are driven by the parent and both can be skipped.' },\n    { tag: 'Visual', title: 'Dark ground means the module is talking about you',\n      did: 'Three colors carry meaning and nothing else: blue for emphasis while teaching, green only to confirm something the parent got right, plum for developmental feedback. Dark screens are reserved for the reflective moments \\u2014 baseline, reflection, close.',\n      rejected: 'Dark as a section marker',\n      why: 'Using dark to mean \"you are in section 3\" made it decoration. It told the parent where they were, which the header already does. Tying it to a mode of address means the shift in ground is doing work no label could. Tinted fields also lost their strokes: once tint carries meaning, a border around it is a second, competing signal.' }\n  ];\n\n  componentDidMount() {\n    this.fit();\n    if (typeof ResizeObserver !== 'undefined' && this.outer.current) {\n      this.ro = new ResizeObserver(() => this.fit());\n      this.ro.observe(this.outer.current);\n    }\n    window.addEventListener('resize', this.fit);\n    window.addEventListener('keydown', this.onKey);\n  }\n  componentWillUnmount() {\n    if (this.ro) this.ro.disconnect();\n    window.removeEventListener('resize', this.fit);\n    window.removeEventListener('keydown', this.onKey);\n    document.body.style.overflow = '';\n  }\n  componentDidUpdate() { this.fit(); }\n\n  fit = () => {\n    const o = this.outer.current, i = this.inner.current;\n    if (!o || !i) return;\n    if (this.state.zoom) {\n      o.style.position = 'fixed';\n      o.style.inset = '0';\n      o.style.zIndex = '60';\n      o.style.overflow = 'auto';\n      o.style.background = '#14161c';\n      o.style.borderRadius = '0';\n      o.style.height = '';\n      o.style.cursor = 'zoom-out';\n      o.style.WebkitOverflowScrolling = 'touch';\n      i.style.transform = 'none';\n      return;\n    }\n    o.style.position = '';\n    o.style.inset = '';\n    o.style.zIndex = '';\n    o.style.overflow = 'hidden';\n    o.style.background = '#EDEAE3';\n    o.style.borderRadius = '6px';\n    o.style.cursor = 'zoom-in';\n    const s = Math.min(1, o.clientWidth / 960);\n    i.style.transform = 'scale(' + s + ')';\n    o.style.height = Math.round(640 * s) + 'px';\n  };\n\n  onKey = (e) => { if (e.key === 'Escape' && this.state.zoom) this.setZoom(false); };\n\n  onFrameKey = (e) => {\n    if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {\n      e.preventDefault();\n      this.setZoom(!this.state.zoom);\n    }\n  };\n\n  closeBtn = React.createRef();\n\n  setZoom = (v) => {\n    this.setState({ zoom: v }, () => {\n      const t = v ? this.closeBtn.current : this.outer.current;\n      if (t && t.focus) t.focus();\n    });\n    document.body.style.overflow = v ? 'hidden' : '';\n  };\n\n  go = (n) => this.setState({ step: n });\n\n  renderVals() {\n    const step = this.state.step;\n    return {\n      outerRef: this.outer,\n      innerRef: this.inner,\n      isBaseline: step === 0,\n      isRolePlay: step === 1,\n      isCoach: step === 2,\n      isBookend: step === 3,\n      isZoomed: this.state.zoom,\n      closeRef: this.closeBtn,\n      onFrameKey: this.onFrameKey,\n      toggleFull: () => this.setZoom(!this.state.zoom),\n      closeFull: (e) => { if (e && e.stopPropagation) e.stopPropagation(); this.setZoom(false); },\n      stepCaption: this.steps[step].caption,\n      decisions: this.decisions,\n      chips: this.steps.map((s, n) => ({\n        code: s.code,\n        label: s.label,\n        bg: n === step ? '#1a1a1a' : '#f6f4f0',\n        fg: n === step ? '#f0eee9' : '#4a463f',\n        go: () => this.go(n)\n      })),\n      prev: () => this.go((step + 3) % 4),\n      next: () => this.go((step + 1) % 4)\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
